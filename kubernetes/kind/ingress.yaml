# kind 本地测试入口；通过 make kind-ingress 暴露到宿主机回环地址。
apiVersion: v1
kind: Namespace
metadata:
  name: kind-ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: kind-ingress
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kind-lab-traefik
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kind-lab-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kind-lab-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: kind-ingress
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kind-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kind-lab-traefik
  template:
    metadata:
      labels:
        app: kind-lab-traefik
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: docker.io/library/traefik:v3.6.0
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --entrypoints.health.address=:9000
            - --ping=true
            - --ping.entrypoint=health
            - --accesslog=true
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: health
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: kind-ingress
spec:
  type: ClusterIP
  selector:
    app: kind-lab-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
