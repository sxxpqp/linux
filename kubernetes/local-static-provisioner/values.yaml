# local-static-provisioner Helm values
# 场景: 3 节点本地 SSD,通过 local-static-provisioner 自动发现 /mnt/disks 下的本地卷目录

nameOverride: ""
fullnameOverride: ""

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

setPVOwnerRef: false
useJobForCleaning: false
useNodeNameOnly: false
mountDevVolume: true
additionalVolumes: []
additionalVolumeMounts: []
enableWindows: false

classes:
  - name: local-ssd
    hostDir: /mnt/disks
    mountDir: /mnt/disks
    volumeMode: Filesystem
    accessMode: ReadWriteOnce
    fsType: ext4
    namePattern: "*"
    blockCleanerCommand:
      - "/scripts/shred.sh"
      - "2"
    storageClass: false

image: registry.k8s.io/sig-storage/local-volume-provisioner:v2.9.0
imagePullSecrets: []

nodeSelector:
  local-storage: ssd

nodeSelectorWindows: {}
nodeLabels: []
tolerations: []
removeNodeNotReadyTaint: false
provisionerNotReadyNodeTaintKey: sig-storage-local-static-provisioner/agent-not-ready
affinity: {}
resources: {}
securityContext: {}
privileged: true
hostPID: false

livenessProbe:
  tcpSocket:
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 60
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe: {}
startupProbe: {}
initContainers: []

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

serviceMonitor:
  enabled: false
