# 默认示例模板: install.sh 会把 __NAMESPACE__ / __STORAGE_CLASS_NAME__ 渲染后再 apply
# 如直接 kubectl apply -f 本文件,请先手工替换占位符
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-ssd-test-pvc
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS_NAME__
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-ssd-test-pod
  namespace: __NAMESPACE__
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo hello-local-ssd > /data/test.txt
          ls -l /data
          sleep 36000
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-ssd-test-pvc
