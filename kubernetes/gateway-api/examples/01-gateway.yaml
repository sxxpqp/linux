# ============================================================
# 01-gateway.yaml — Gateway 两种常见形态
# 先安装:
#   bash kubernetes/gateway-api/install.sh
# 或只装 CRD:
#   bash kubernetes/gateway-api/install.sh --skip-ngf
# 形态 A: 单域名业务入口(一个团队 / 一个应用)
# 形态 B: 通配符共享入口(多团队共用,平台团队创建)
# ============================================================

# ---------- 形态 A: 单域名 Gateway ----------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  namespace: default
spec:
  gatewayClassName: nginx              # 换成实际的 GatewayClass:kubectl get gatewayclass
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "app.sxxpqp.top"         # 精确域名
    tls:
      mode: Terminate
      certificateRefs:
      - name: app-tls                  # 同 namespace 的 Secret(cert-manager 签发)
    allowedRoutes:
      namespaces:
        from: Same                     # 只允许本 namespace 的路由接入
  - name: http
    protocol: HTTP
    port: 80
    hostname: "app.sxxpqp.top"
    allowedRoutes:
      namespaces:
        from: Same
---
# ---------- 形态 B: 通配符共享 Gateway(多团队)----------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
    # HTTP 明文入口(可选:后面配合 HTTPRoute 做 301 跳转到 https)
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.wishfoxs.com"
      allowedRoutes:
        namespaces:
          from: All          # 允许其他 namespace 的 HTTPRoute 挂进来,按需改成 Same

    # HTTPS,通配符域名,TLS 终止
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.wishfoxs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wishfox   # 你自己建的 Secret 名字
            # namespace 不填默认取当前 Gateway 所在 ns(nginx-gateway)
      allowedRoutes:
        namespaces:
          from: All