# 独立测试集群：kind create cluster --name kubesphere-341 --config <本文件>
# 使用 kind v0.17.0；保留默认 kubeconfig/context，创建时显式传 --kubeconfig。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  # 离线加载标签；下载时验证上游索引摘要 sha256:577c630ce8e509131eab1aea12c022190978dd2f745aac5eb1fe65c0807eb315。
  image: kindest/node:v1.24.7
  extraPortMappings:
  - containerPort: 30880
    hostPort: 30880
    listenAddress: "127.0.0.1"
    protocol: TCP
# 此旧节点镜像内含 legacy registry.mirrors，创建时不要叠加 config_path，二者冲突会使 CRI 插件失败。
# 需要 certs.d 时先备份并移除节点 config.toml 的 legacy mirrors 配置，再启用 config_path。
